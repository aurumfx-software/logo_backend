# Snippet for /etc/nginx/sites-available/logo — API on port 443, frontend often on :8443 (cross-origin).
# Replace 127.0.0.1:8000 with your uvicorn bind address.

upstream logo_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name 168.144.18.149.sslip.io;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_pass http://logo_api;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Wallet WebSocket (sale QR realtime)
    location /api/v1/wallet/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://logo_api;
        proxy_read_timeout 3600s;
    }
}

# Run API (example):
#   cd /path/to/logo_backend && source .venv/bin/activate
#   uvicorn app.main:app --host 127.0.0.1 --port 8000
